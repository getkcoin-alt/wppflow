<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08090a" />
    <meta
      name="description"
      content="Scriwo — the shared WhatsApp inbox for teams. Every conversation, one calm place."
    />
    <link rel="icon" type="image/png" href="/brand/scriwo-mark-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>Scriwo</title>
    <!-- Apply the saved (or system) theme before first paint so there is never a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("scriwo_theme");
          var dark =
            t === "dark" ||
            (t !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.toggle("dark", dark);
          r.dataset.theme = dark ? "dark" : "light";
          r.style.colorScheme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#08090a" : "#f5f5f7");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app text-fg min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
