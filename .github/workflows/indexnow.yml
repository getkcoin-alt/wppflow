name: IndexNow
# Tells Bing, Yandex, Naver, Seznam and Yep (and through Bing, ChatGPT search and Copilot)
# that www.scriwo.com changed, once the production deploy is live.
on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: www.scriwo.com
      KEY: cd9b179b3a5c1d063a3e2372537f44ff
    steps:
      - name: Wait for the deploy to serve the key
        run: |
          for i in $(seq 1 40); do
            curl -fsS "https://$HOST/$KEY.txt" | grep -qx "$KEY" && exit 0
            sleep 15
          done
          echo "Key file not served yet"; exit 1
      - name: Submit every sitemap URL
        run: |
          sleep 120 # let the new deploy finish going live before engines fetch
          curl -fsS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' > urls.txt
          wc -l urls.txt
          python3 -c "import json;print(json.dumps({'host':'$HOST','key':'$KEY','keyLocation':'https://$HOST/$KEY.txt','urlList':open('urls.txt').read().split()}))" > body.json
          curl -sS -o resp.txt -w "%{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @body.json | tee code.txt
          cat resp.txt
          grep -qE '^(200|202)$' code.txt
